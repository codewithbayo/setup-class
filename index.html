<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>First HTML Class</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    style="
      margin: 0px;
      padding: 0px;
      display: flex;
      flex-direction: column;
      align-items: center;
    "
  >
    <header class="header-component">
      <img
        src="https://www.chiggyfoundation.org/_next/image?url=%2Fassets%2Flogo%2Flogo-color.png&w=750&q=75"
        alt="chiggy foundation logo"
        width="100"
      />
      <nav class="navigation-container">
        <a href="https://google.com"> Home </a>
        <a href="https://google.com"> About </a>
        <a href="https://google.com"> Contact </a>
        <a href="https://facebook.com"> Team </a>
        <button onclick="SubmitEvent" type="button" class="donate-button">
        Donate
      </button>
      </nav>
      
    </header>

    <section class="hero-section">
      <div class="hero-text-container">
        <h2>Est. 2024 · Abuja, Nigeria</h2>
        <h1>A little care goes a long way.</h1>
        <p>
          From the first wash of the day to the last dish at night, Saso makes the familiar essentials that help home feel like home.
        </p>
        <span class="hero-button-container">
          <button class="explore-button">Explore Our Work</button>
          <button class="get-involved-button">Get Involved</button>
        </span>
      </div>
      <div class="hero-image-container">
        <img
          src="https://sasoindustries.com/assets/313482be-fbd7-4139-98ff-f214eebfbd6f-BVf4MAVX.JPG"
          alt=""
          class="hero-image"
        />
      </div>
    </section>

</html>
